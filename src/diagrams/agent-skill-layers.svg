<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="Skill 的三層載入" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="10" y="20" width="700" height="56" rx="10" fill="#3F4FC0"/>
  <text x="30" y="46" fill="#fff" font-size="15" font-weight="700">第一層：name + description</text>
  <text x="30" y="66" fill="#DDE2FA" font-size="13">永遠在 context 裡。每個 Skill 只佔幾十個 token，AI 靠它判斷「現在要不要用這個 Skill」</text>
  <rect x="90" y="88" width="620" height="56" rx="10" fill="#5B69CF"/>
  <text x="110" y="114" fill="#fff" font-size="15" font-weight="700">第二層：SKILL.md 本文</text>
  <text x="110" y="134" fill="#E5E8FB" font-size="13">判斷需要時才讀進來：步驟、注意事項</text>
  <rect x="170" y="156" width="540" height="56" rx="10" fill="#8C97E0"/>
  <text x="190" y="182" fill="#fff" font-size="15" font-weight="700">第三層：附檔與腳本</text>
  <text x="190" y="202" fill="#fff" font-size="13">真的用到才開：metrics.md、template.md、check_totals.py</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
