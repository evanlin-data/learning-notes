  <rect x="450" y="104" width="260" height="56" rx="10" fill="#E9F4F4" stroke="#0E8A8C" stroke-width="2"/><text x="580" y="138" text-anchor="middle" font-size="15">GitHub</text>
  <rect x="450" y="174" width="260" height="56" rx="10" fill="#E9F4F4" stroke="#0E8A8C" stroke-width="2"/><text x="580" y="208" text-anchor="middle" font-size="15">檔案系統</text>
  <rect x="450" y="244" width="260" height="56" rx="10" fill="#E9F4F4" stroke="#0E8A8C" stroke-width="2"/><text x="580" y="278" text-anchor="middle" font-size="15">Slack、Google Drive…</text>

