<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="MCP 架構：Host、Client、Server" xmlns:c2pa="http://c2pa.org/manifest">
  <text x="10" y="22" font-size="14" font-weight="700" fill="#586374">AI 應用（Host）</text>
  <rect x="10" y="34" width="200" height="56" rx="10" fill="#3F4FC0"/><text x="110" y="68" text-anchor="middle" fill="#fff" font-size="15">Claude Desktop</text>
  <rect x="10" y="104" width="200" height="56" rx="10" fill="#3F4FC0"/><text x="110" y="138" text-anchor="middle" fill="#fff" font-size="15">Claude Code</text>
  <rect x="10" y="174" width="200" height="56" rx="10" fill="#3F4FC0"/><text x="110" y="208" text-anchor="middle" fill="#fff" font-size="15">你自己寫的 Agent</text>
  <rect x="10" y="244" width="200" height="56" rx="10" fill="#fff" stroke="#3F4FC0" stroke-dasharray="5 4"/><text x="110" y="278" text-anchor="middle" fill="#3F4FC0" font-size="15">其他支援 MCP 的工具</text>

