<svg viewBox="0 0 840 170" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang TC,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
      <defs><marker id="a6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker></defs>
      <g font-size="14" text-anchor="middle">
        <rect x="5" y="30" width="150" height="80" rx="12" fill="#f3ede3" stroke="#c9bfae"/><text x="80" y="62" font-weight="700">① 開分支</text><text x="80" y="86" fill="#5b6470" font-size="12">git switch -c fix-sql</text>
        <rect x="175" y="30" width="150" height="80" rx="12" fill="#f3ede3" stroke="#c9bfae"/><text x="250" y="62" font-weight="700">② 改 + commit</text><text x="250" y="86" fill="#5b6470" font-size="12">可以 commit 很多次</text>
        <rect x="345" y="30" width="150" height="80" rx="12" fill="#f3ede3" stroke="#c9bfae"/><text x="420" y="62" font-weight="700">③ push 分支</text><text x="420" y="86" fill="#5b6470" font-size="12">git push -u origin fix-sql</text>
        <rect x="515" y="30" width="150" height="80" rx="12" fill="#eaf1f9" stroke="#3a6ea5"/><text x="590" y="62" font-weight="700">④ 開 PR</text><text x="590" y="86" fill="#5b6470" font-size="12">同事 review、留言</text>
        <rect x="685" y="30" width="150" height="80" rx="12" fill="#eef8f6" stroke="#2a9d8f"/><text x="760" y="62" font-weight="700">⑤ Merge</text><text x="760" y="86" fill="#5b6470" font-size="12">合進 main ✅</text>
      </g>
      <g stroke="#5b6470" stroke-width="2.5" marker-end="url(#a6)">
        <line x1="157" y1="70" x2="171" y2="70"/><line x1="327" y1="70" x2="341" y2="70"/>
        <line x1="497" y1="70" x2="511" y2="70"/><line x1="667" y1="70" x2="681" y2="70"/>
      </g>
      <text x="420" y="150" text-anchor="middle" font-size="14" fill="#5b6470">PR = 「我改好了，請幫我檢查一下，沒問題就合進主線」</text>
