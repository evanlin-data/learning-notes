<svg viewBox="0 0 860 150" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang TC,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
      <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker></defs>
      <g font-size="13.5" text-anchor="middle">
        <rect x="4" y="25" width="128" height="74" rx="12" fill="#eaf1f9" stroke="#3a6ea5"/><text x="68" y="55" font-weight="700">① 開分支</text><text x="68" y="78" fill="#5b6470" font-size="11.5">從 main 分出去</text>
        <rect x="148" y="25" width="128" height="74" rx="12" fill="#fdf7e8" stroke="#e9b44c"/><text x="212" y="55" font-weight="700">② 改 + commit</text><text x="212" y="78" fill="#5b6470" font-size="11.5">add → commit</text>
        <rect x="292" y="25" width="128" height="74" rx="12" fill="#eef8f6" stroke="#2a9d8f"/><text x="356" y="55" font-weight="700">③ push</text><text x="356" y="78" fill="#5b6470" font-size="11.5">push -u origin 分支</text>
        <rect x="436" y="25" width="128" height="74" rx="12" fill="#f4f0fa" stroke="#7b5ea7"/><text x="500" y="55" font-weight="700">④ 開 PR</text><text x="500" y="78" fill="#5b6470" font-size="11.5">比較兩條分支</text>
        <rect x="580" y="25" width="128" height="74" rx="12" fill="#fdf0f1" stroke="#d1495b"/><text x="644" y="55" font-weight="700">⑤ 協作</text><text x="644" y="78" fill="#5b6470" font-size="11.5">review、再 commit</text>
        <rect x="724" y="25" width="128" height="74" rx="12" fill="#e7f5e9" stroke="#2a9d8f"/><text x="788" y="55" font-weight="700">⑥ 合併進 main</text><text x="788" y="78" fill="#5b6470" font-size="11.5">然後刪掉分支</text>
      </g>
      <g stroke="#5b6470" stroke-width="2.2" marker-end="url(#m)">
        <line x1="134" y1="62" x2="145" y2="62"/><line x1="278" y1="62" x2="289" y2="62"/><line x1="422" y1="62" x2="433" y2="62"/><line x1="566" y1="62" x2="577" y2="62"/><line x1="710" y1="62" x2="721" y2="62"/>
      </g>
      <text x="430" y="135" text-anchor="middle" font-size="13" fill="#5b6470">分支是為了「目的」而開的，不是為了「人」</text>
    <metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
