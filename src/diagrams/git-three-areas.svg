<svg viewBox="0 0 840 290" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang TC,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
      <defs>
        <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
        <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
      </defs>
      <rect x="20" y="40" width="220" height="150" rx="16" fill="#fdf7e8" stroke="#e9b44c" stroke-width="2.5"/>
      <text x="130" y="75" text-anchor="middle" font-size="19" font-weight="700">🖊️ 工作區</text>
      <text x="130" y="100" text-anchor="middle" font-size="13" fill="#5b6470">Working Directory</text>
      <text x="130" y="135" text-anchor="middle" font-size="14">你正在編輯的檔案</text>
      <text x="130" y="158" text-anchor="middle" font-size="14">（書桌）</text>

      <rect x="310" y="40" width="220" height="150" rx="16" fill="#eef8f6" stroke="#2a9d8f" stroke-width="2.5"/>
      <text x="420" y="75" text-anchor="middle" font-size="19" font-weight="700">📦 暫存區</text>
      <text x="420" y="100" text-anchor="middle" font-size="13" fill="#5b6470">Staging Area</text>
      <text x="420" y="135" text-anchor="middle" font-size="14">準備要存的改動</text>
      <text x="420" y="158" text-anchor="middle" font-size="14">（紙箱）</text>

      <rect x="600" y="40" width="220" height="150" rx="16" fill="#eaf1f9" stroke="#3a6ea5" stroke-width="2.5"/>
      <text x="710" y="75" text-anchor="middle" font-size="19" font-weight="700">🗄️ 儲存庫</text>
      <text x="710" y="100" text-anchor="middle" font-size="13" fill="#5b6470">Repository (.git)</text>
      <text x="710" y="135" text-anchor="middle" font-size="14">正式的存檔紀錄</text>
      <text x="710" y="158" text-anchor="middle" font-size="14">（已寄出的包裹）</text>

      <line x1="245" y1="100" x2="303" y2="100" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a2)"/>
      <text x="275" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#2a9d8f">git add</text>
      <line x1="275" y1="30" x2="275" y2="92" stroke="#2a9d8f" stroke-dasharray="3 3"/>

      <line x1="535" y1="100" x2="593" y2="100" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a2)"/>
      <text x="565" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#3a6ea5">git commit</text>
      <line x1="565" y1="30" x2="565" y2="92" stroke="#3a6ea5" stroke-dasharray="3 3"/>

      <path d="M700 195 Q 420 290 140 195" fill="none" stroke="#d1495b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a3)"/>
      <text x="420" y="268" text-anchor="middle" font-size="14" fill="#d1495b" font-weight="700">git checkout / git restore：把舊版本拿回書桌</text>
    <metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
